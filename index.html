<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Webpage Layout</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }

        nav {
            background-color: blue;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
        }

        .container {
            display: flex;
            padding: 20px;
        }

        .content {
            flex: 3;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .sidebar {
            flex: 1;
            padding: 20px;
            background-color: #ddd;
            margin-left: 10px;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>I LOVE YOU SREEJA</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">
        <div class="content">
            <h2>Main Content</h2>
            <p>THIS IS YOUR RAJESH.</p>
        </div>

        <div class="sidebar">
            <h3>Sidebar</h3>
            <p>I WANT TO MEET YOU</p>
        </div>
    </div>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
